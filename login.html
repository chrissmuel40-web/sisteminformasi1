<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SIM Presensi & Informasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #00b87c;
            --primary-light: #e5f7f1;
            --dark: #111827;
            --bg: #f3f4f6;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --card-bg: #ffffff;
            --border: #e5e7eb;
            --danger: #fee2e2;
            --danger-text: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background-color: var(--bg); 
            color: var(--text-main); 
            padding: 20px;
        }

        .login-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border);
        }

        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-icon {
            background: var(--primary);
            color: white;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            font-size: 30px;
            margin: 0 auto 15px;
            box-shadow: 0 4px 12px rgba(0, 184, 124, 0.25);
        }

        .login-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }

        .login-header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border-radius: 10px;
            border: 1px solid var(--border);
            font-size: 14px;
            background: #f9fafb;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--text-muted);
            background: none;
            border: none;
        }

        .btn-login {
            width: 100%;
            background: var(--primary);
            color: white;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: #009968;
        }

        .error-message {
            background: var(--danger);
            color: var(--danger-text);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 18px;
            display: none;
            text-align: center;
        }

        .info-text {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 22px;
            line-height: 1.5;
        }

        .helper-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 6px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <h2>SIM Presensi & Informasi</h2>
            <p>Portal Mahasiswa</p>
        </div>

        <div class="error-message" id="errorMsg">
            <i class="fa-solid fa-circle-exclamation"></i> Akun atau Kata Sandi tidak sesuai.
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">NIM Mahasiswa</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-id-card input-icon"></i>
                    <input type="text" id="username" class="form-control" placeholder="Masukkan NIM mahasiswa" required autocomplete="off">
                </div>
                <span class="helper-text">Contoh: i43251288[cite: 37]</span>
            </div>

            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control" placeholder="Masukkan kata sandi" required>
                    <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <span class="helper-text">Contoh: zebua[cite: 37]</span>
            </div>

            <button type="submit" class="btn-login" id="btnSubmit">Masuk ke Portal</button>
        </form>

        <div class="info-text">
            Admin masuk dengan username dan kata sandi.<br>
            Mahasiswa masuk dengan NIM dan kata sandi akun[cite: 37].
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const btn = document.getElementById('btnSubmit');

            errorMsg.style.display = 'none';
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memverifikasi...';
            btn.disabled = true;

            const roleToTest = (username.toLowerCase() === 'admin') ? 'admin' : 'student';

            try {
                const response = await fetch('api_akun.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'login',
                        role: roleToTest,
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userRole', data.role);
                    
                    if (data.role === 'admin') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    throw new Error(data.message || 'Akun atau Kata Sandi tidak sesuai.');
                }
            } catch (err) {
                errorMsg.style.display = 'block';
                errorMsg.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> ${err.message}`;
                btn.innerHTML = 'Masuk ke Portal';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
